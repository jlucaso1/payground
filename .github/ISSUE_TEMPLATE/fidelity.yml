name: Fidelity report
description: payground answers differently from the real Mercado Pago API.
title: "[fidelity] "
labels: ["fidelity"]
body:
  - type: markdown
    attributes:
      value: |
        payground exists to behave like `api.mercadopago.com`, so any difference is a defect.

        Check the known divergences before you file: run `payground doctor`, read `GET /_payground/parity`
        on a running instance, or open `FIDELITY.md`. If the difference is already listed there, say so
        in the report instead of opening a duplicate.
  - type: input
    id: endpoint
    attributes:
      label: Endpoint
      description: Method and path, as the real API spells it.
      placeholder: POST /v1/payments
    validations:
      required: true
  - type: dropdown
    id: product
    attributes:
      label: Product
      description: Which area of the API the endpoint belongs to.
      options:
        - payments
        - checkout (preferences)
        - orders
        - customers and cards
        - refunds, chargebacks and disputes
        - claims
        - subscriptions (preapproval)
        - payouts and money transfers
        - point (terminals)
        - qr (in-store orders)
        - stores and POS
        - identity and users
        - reports (release and settlement)
        - wallet connect
        - webhooks and notifications
        - other or not sure
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request sent
      description: The full request, including headers that matter. Remove your access token.
      render: http
    validations:
      required: true
  - type: textarea
    id: payground-response
    attributes:
      label: What payground returned
      description: Status code and body.
      render: json
    validations:
      required: true
  - type: textarea
    id: real-response
    attributes:
      label: What the real API returns
      description: Status code and body from api.mercadopago.com for the same request.
      render: json
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Link to the Mercado Pago reference page, the official SDK source, or a captured response that proves the real behaviour.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: payground version
      description: Output of `payground --version`.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Country site, integration flow, or context that changes the response.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I checked `payground doctor`, `GET /_payground/parity` and `FIDELITY.md`.
          required: true
        - label: The request and response bodies contain no real card numbers, tokens or personal data.
          required: true
