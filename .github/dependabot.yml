version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"

  # Package updates are deliberately not automated. payground has no runtime
  # dependencies, so the only surface is devDependencies (TypeScript, React,
  # Tailwind, type packages), and neither ecosystem handles this repo correctly:
  # the npm updater edits package.json without touching bun.lock, which then
  # fails CI's --frozen-lockfile, and the bun updater currently rewrites fields
  # it does not understand.
  # https://github.com/dependabot/dependabot-core/issues/13623
  # https://github.com/dependabot/dependabot-core/issues/15848
