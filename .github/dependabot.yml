version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"

  # The npm ecosystem covers the Bun workspace. payground has no runtime
  # dependencies, so every update here is a devDependency.
  - package-ecosystem: npm
    directories:
      - /
      - /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        patterns:
          - "*"
