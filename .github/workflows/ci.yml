name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to a PR supersedes the first; do not pay for both. Pushes to main
# are never cancelled, so every merged commit keeps its own build status.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Exact pin so a Bun release cannot break the build overnight. Must satisfy
  # `engines.bun` in packages/cli/package.json and stay on the Dockerfile's 1.4 line.
  BUN_VERSION: 1.4.1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Unfiltered install on purpose: e2e is a workspace member and bunfig.toml
      # disables peer auto-install, which otherwise pulls a 150 MB Bun runtime.
      - run: bun install --frozen-lockfile
      - name: lockfile is up to date
        run: git diff --exit-code bun.lock
      - run: bun run typecheck
      - run: bun test packages tools
      - run: bun run build
      # Generated adapter code is committed; upstream drift must fail the build.
      - run: bun run spec:gen && git diff --exit-code

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Drives the real mercadopago SDK against the emulator.
      - run: bun run test:e2e

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t payground:ci .
      - name: smoke test the image
        run: |
          docker run -d --rm --name payground-ci -p 8080:8080 payground:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/_payground/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/_payground/health
          docker stop payground-ci
