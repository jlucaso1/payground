name: docker
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Never let two publishes for the same ref race for a tag. Superseded pull request
# builds are safe to cancel; a half-finished publish is not.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # No id-token: write. The provenance and SBOM below are buildkit attestations
    # pushed inside the manifest list; they are not OIDC-signed, so nothing needs it.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both oven/bun:1.4 and oven/bun:1.4-slim publish linux/arm64 manifests,
      # so the arm64 leg is emulated here rather than skipped.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=auto keeps `latest` on semver tags only, never on main.
          flavor: latest=auto
          tags: |
            type=edge,branch=main
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.description=Self-hosted sandbox that speaks the Mercado Pago API
            org.opencontainers.image.licenses=MIT

      # amd64 only and no attestations: the docker exporter that `load` uses cannot
      # carry a manifest list or attestation manifests. This is the smoke test build;
      # the push below rebuilds from the same cache for both platforms.
      - name: build for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: payground:smoke
          provenance: false
          sbom: false
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      # An image that starts and crashes is worse than no image at all.
      - name: smoke test
        run: |
          # No --rm: a container that crashes on startup must stick around long
          # enough for docker logs to explain why.
          docker run -d --name payground-smoke -p 8080:8080 payground:smoke
          ok=""
          deadline=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if curl -fsS http://127.0.0.1:8080/_payground/health; then
              ok=1
              break
            fi
            if [ -z "$(docker ps -q -f name=payground-smoke)" ]; then
              echo "container exited before answering"
              break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            docker logs payground-smoke || true
            docker rm -f payground-smoke || true
            exit 1
          fi
          docker rm -f payground-smoke

      - name: login to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Guarded on the event, not on permissions, so a fork pull request can never publish.
      - name: build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=multi
          cache-to: type=gha,mode=max,scope=multi
